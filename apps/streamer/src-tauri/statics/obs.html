<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #container {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0;
      width: 100%;
      height: 100%;
    }
    .harvestsona {
      flex: 0 1 50vw;
      max-width: 50vw;
      max-height: 100vh;
      object-fit: contain;
      transition: transform 0.5s cubic-bezier(0.34, 1.0, 0.64, 1.0), opacity 0.5s ease;
      opacity: 0;
    }
    .harvestsona img {
      width: 100%;
      height: auto;
      max-height: 80vh;
      object-fit: contain;
      display: block;
    }
    .harvestsona .expression {
      position: absolute;
      top: -15vh;
      right: -6vw;
    }
    .harvestsona-left {
      transform: translateY(120%);
    }
    .harvestsona-right {
      transform: translateY(120%);
    }
    .harvestsona.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="leftHarvestsona" class="harvestsona harvestsona-left">
      <img class="expression" src="/expression.gif" alt="expression" />
      <img class="dude" src="" alt="" />
    </div>
    <div id="rightHarvestsona" class="harvestsona harvestsona-right">
      <img class="expression" src="/expression.gif" alt="expression" />
      <img class="dude" src="" alt="" />
    </div>
  </div>
  <script src="/obs.js"></script>
</body>
</html>
